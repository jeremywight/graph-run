name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate and installer tests
        run: bash tests/test-gate.sh
      - name: Shell lint
        run: shellcheck --severity=warning .claude/hooks/gate.sh install.sh tests/test-gate.sh
